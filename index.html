<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Tracker</title>
  </head>
  <body>
    <main>
      <h1>GPA Tracker</h1>
      <p id="storage-warning" class="warning" role="alert" hidden></p>

      <form id="course-form" novalidate>
        <div class="field">
          <label for="name">Tên môn</label>
          <input id="name" name="name" type="text" autocomplete="off" aria-describedby="name-error" />
          <p class="error" id="name-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="credits">Số tín chỉ</label>
          <input id="credits" name="credits" type="text" inputmode="numeric" autocomplete="off" aria-describedby="credits-error" />
          <p class="error" id="credits-error" role="alert"></p>
        </div>
        <div class="field">
          <label for="score">Điểm hệ 10</label>
          <input id="score" name="score" type="text" inputmode="decimal" autocomplete="off" aria-describedby="score-error" />
          <p class="error" id="score-error" role="alert"></p>
        </div>
        <div class="actions">
          <button type="submit" id="submit-btn">Thêm môn</button>
          <button type="button" id="cancel-btn" class="secondary" hidden>Huỷ</button>
        </div>
      </form>

      <section id="summary">
        <h2>Kết quả học tập</h2>
        <dl class="stats">
          <div><dt>Tổng số môn</dt><dd id="stat-courses">—</dd></div>
          <div><dt>Tổng tín chỉ</dt><dd id="stat-credits">—</dd></div>
          <div><dt>Tín chỉ đạt</dt><dd id="stat-passed">—</dd></div>
          <div><dt>GPA hệ 4</dt><dd id="stat-gpa4">—</dd></div>
          <div><dt>GPA hệ 10</dt><dd id="stat-gpa10">—</dd></div>
          <div><dt>Xếp loại</dt><dd id="stat-class">—</dd></div>
        </dl>
        <p id="summary-hint">Hãy thêm môn học đầu tiên</p>
      </section>

      <section>
        <div class="list-head">
          <h2>Danh sách môn học</h2>
          <button type="button" id="clear-btn" class="danger" disabled>Xoá tất cả</button>
        </div>
        <p id="empty-hint">Hãy thêm môn học đầu tiên</p>
        <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Tên môn</th><th>Tín chỉ</th><th>Điểm hệ 10</th><th>Điểm chữ</th><th>Hệ 4</th><th>Thao tác</th></tr>
          </thead>
          <tbody id="course-rows"></tbody>
        </table>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
